stages:
  - lint
  - release

php-lint:
  stage: lint
  image: php:8.2-cli
  script:
    - find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

release:
  stage: release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - apk add --no-cache git curl
  script:
    - mkdir -p dist
    - git archive --format=zip --prefix=ddns_admin_whitelist/
        -o "dist/ddns_admin_whitelist-${CI_COMMIT_TAG}.zip" HEAD
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/ddns_admin_whitelist-${CI_COMMIT_TAG}.zip" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ddns_admin_whitelist/${CI_COMMIT_TAG}/ddns_admin_whitelist-${CI_COMMIT_TAG}.zip"
  artifacts:
    paths:
      - dist/
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Phát hành $CI_COMMIT_TAG bởi CI/CD của tổ chức hitechcloudvn.

    Co-authored-by: pgt-vn <nguyenthanhan92f1@gmail.com>
    Co-authored-by: agent-hitechcloud <agent@hitechcloud.vn>"
    assets:
      links:
        - name: ddns_admin_whitelist-$CI_COMMIT_TAG.zip
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ddns_admin_whitelist/${CI_COMMIT_TAG}/ddns_admin_whitelist-${CI_COMMIT_TAG}.zip"
